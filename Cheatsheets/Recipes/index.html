<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wurm Recipes</title>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #1C1712;
            color: #F2E8D8;
            font-family: Tahoma, Verdana, Arial, sans-serif;
            line-height: 1.35;
        }

        .app_shell {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .top_bar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #241D16;
            border-bottom: 4px solid #6B5A45;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
        }

        .top_bar_inner {
            max-width: 980px;
            margin: 0 auto;
            padding: 14px 14px 12px 14px;
        }

        .title_row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .status_line {
            margin: 0;
            color: #D7CDBB;
            font-size: 12px;
        }

        .search_row {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        label {
            font-size: 12px;
            color: #E9E0D2;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        input[type="search"] {
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            padding: 12px 12px;
            color: #F2E8D8;
            background: #1A140F;
            border: 3px solid #6B5A45;
            border-top-color: #8B7A62;
            border-left-color: #8B7A62;
            outline: none;
            border-radius: 0;
            box-shadow: inset 3px 3px 0 rgba(0, 0, 0, 0.35);
        }

        input[type="search"]::placeholder {
            color: #C5B9A6;
        }

        input[type="search"]:focus {
            outline: 3px solid #E3C28A;
            outline-offset: 2px;
        }

        .content_area {
            max-width: 980px;
            width: 100%;
            margin: 0 auto;
            padding: 14px;
            box-sizing: border-box;
            flex: 1 1 auto;
        }

        .recipe_list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            background: #241D16;
            border: 3px solid #6B5A45;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35);
            border-radius: 0;
        }

        .card_inner {
            padding: 12px;
        }

        .card_title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .card_meta {
            margin-top: 6px;
            color: #D7CDBB;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .tag {
            display: inline-block;
            padding: 2px 6px;
            border: 2px solid #6B5A45;
            background: #1A140F;
            color: #F2E8D8;
            box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 11px;
        }

        .card_body {
            margin-top: 10px;
            color: #F2E8D8;
            font-size: 13px;
        }

        .card_body .muted {
            color: #D7CDBB;
        }

        details {
            margin-top: 10px;
            border-top: 2px solid #6B5A45;
            padding-top: 8px;
        }

        summary {
            cursor: pointer;
            user-select: none;
            list-style: none;
            font-size: 12px;
            color: #F2E8D8;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            display: inline-block;
            padding: 4px 6px;
            border: 2px solid #6B5A45;
            background: #1A140F;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary:focus {
            outline: 3px solid #E3C28A;
            outline-offset: 2px;
        }

        pre {
            margin: 10px 0 0 0;
            padding: 10px;
            background: #1A140F;
            border: 2px solid #6B5A45;
            color: #F2E8D8;
            overflow: auto;
            font-size: 12px;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 3px 3px 0 rgba(0, 0, 0, 0.25);
        }

        .empty_state {
            background: #241D16;
            border: 3px solid #6B5A45;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35);
            padding: 14px;
            color: #F2E8D8;
        }

        .empty_state .muted {
            color: #D7CDBB;
        }

        @media (min-width: 720px) {
            .recipe_list {
                grid-template-columns: 1fr 1fr;
            }

            h1 {
                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="app_shell">
        <header class="top_bar">
            <div class="top_bar_inner">
                <div class="title_row">
                    <h1>Recipes</h1>
                    <p class="status_line" id="status_line" role="status" aria-live="polite">Loading…</p>
                </div>
                <div class="search_row">
                    <label for="search_input">Search (realtime)</label>
                    <input id="search_input" type="search" placeholder="Name, skill, ingredient, result…" autocomplete="off" spellcheck="false">
                </div>
            </div>
        </header>

        <main class="content_area">
            <div id="recipe_list" class="recipe_list" role="list"></div>
        </main>
    </div>

    <script>
        (function () {
            var all_recipes = [];
            var filtered_recipes = [];
            var status_line = document.getElementById('status_line');
            var search_input = document.getElementById('search_input');
            var recipe_list = document.getElementById('recipe_list');
            var pending_render = 0;

            function normalize_text(text) {
                if (text === null || text === undefined) {
                    return '';
                }
                return String(text).toLowerCase();
            }

            function add_string(value, out_list) {
                if (value === null || value === undefined) {
                    return;
                }
                if (typeof value === 'string') {
                    out_list.push(value);
                    return;
                }
                if (Array.isArray(value)) {
                    add_array_strings(value, out_list);
                    return;
                }
                if (typeof value === 'object') {
                    add_object_strings(value, out_list);
                }
            }

            function add_array_strings(arr, out_list) {
                var i = 0;
                for (i = 0; i < arr.length; i += 1) {
                    add_string(arr[i], out_list);
                }
            }

            function add_object_strings(obj, out_list) {
                var key = '';
                for (key in obj) {
                    if (Object.prototype.hasOwnProperty.call(obj, key)) {
                        add_string(obj[key], out_list);
                    }
                }
            }

            function build_search_text(recipe) {
                var parts = [];
                add_string(recipe.name, parts);
                add_string(recipe.recipeid, parts);
                add_string(recipe.skill, parts);
                add_string(recipe.known, parts);
                add_string(recipe.active, parts);
                add_string(recipe.target, parts);
                add_string(recipe.result, parts);
                add_string(recipe.ingredients, parts);
                add_string(recipe.containers, parts);
                add_string(recipe.cookers, parts);
                add_string(recipe.trigger, parts);
                return normalize_text(parts.join(' | '));
            }

            function safe_json_preview(value) {
                var text = '';
                try {
                    text = JSON.stringify(value, null, 2);
                } catch (err) {
                    text = String(value);
                }
                if (text.length > 2400) {
                    text = text.slice(0, 2400) + '\n…';
                }
                return text;
            }

            function set_status(text) {
                status_line.textContent = text;
            }

            function get_active_id(recipe) {
                if (!recipe || !recipe.active) {
                    return '';
                }
                if (typeof recipe.active === 'object' && recipe.active.id) {
                    return String(recipe.active.id);
                }
                return '';
            }

            function get_target_id(recipe) {
                if (!recipe || !recipe.target) {
                    return '';
                }
                if (typeof recipe.target === 'object' && recipe.target.id) {
                    return String(recipe.target.id);
                }
                return '';
            }

            function get_result_label(recipe) {
                if (!recipe || !recipe.result) {
                    return '';
                }
                if (typeof recipe.result === 'object') {
                    if (recipe.result.name) {
                        return String(recipe.result.name);
                    }
                    if (recipe.result.id) {
                        return String(recipe.result.id);
                    }
                }
                return '';
            }

            function render_empty_state(message, detail) {
                var wrap = document.createElement('div');
                wrap.className = 'empty_state';

                var main = document.createElement('div');
                main.textContent = message;
                wrap.appendChild(main);

                if (detail) {
                    var sub = document.createElement('div');
                    sub.className = 'muted';
                    sub.style.marginTop = '8px';
                    sub.textContent = detail;
                    wrap.appendChild(sub);
                }

                recipe_list.textContent = '';
                recipe_list.appendChild(wrap);
            }

            function build_card(recipe) {
                var card = document.createElement('article');
                card.className = 'card';
                card.setAttribute('role', 'listitem');

                var inner = document.createElement('div');
                inner.className = 'card_inner';
                card.appendChild(inner);

                var title = document.createElement('h2');
                title.className = 'card_title';
                title.textContent = recipe.name ? String(recipe.name) : '(unnamed recipe)';
                inner.appendChild(title);

                var meta = document.createElement('div');
                meta.className = 'card_meta';
                inner.appendChild(meta);

                var id_tag = document.createElement('span');
                id_tag.className = 'tag';
                id_tag.textContent = recipe.recipeid ? ('id ' + String(recipe.recipeid)) : 'id ?';
                meta.appendChild(id_tag);

                if (recipe.skill) {
                    var skill_tag = document.createElement('span');
                    skill_tag.className = 'tag';
                    skill_tag.textContent = String(recipe.skill);
                    meta.appendChild(skill_tag);
                }

                if (recipe.known === true) {
                    var known_tag = document.createElement('span');
                    known_tag.className = 'tag';
                    known_tag.textContent = 'known';
                    meta.appendChild(known_tag);
                }

                var body = document.createElement('div');
                body.className = 'card_body';
                inner.appendChild(body);

                var active_id = get_active_id(recipe);
                var target_id = get_target_id(recipe);
                var result_label = get_result_label(recipe);

                var line = document.createElement('div');
                if (active_id || target_id || result_label) {
                    line.textContent = '';
                    if (active_id) {
                        var a = document.createElement('span');
                        a.textContent = active_id;
                        line.appendChild(a);

                        var sep1 = document.createElement('span');
                        sep1.className = 'muted';
                        sep1.textContent = ' + ';
                        line.appendChild(sep1);
                    }

                    if (target_id) {
                        var t = document.createElement('span');
                        t.textContent = target_id;
                        line.appendChild(t);

                        var sep2 = document.createElement('span');
                        sep2.className = 'muted';
                        sep2.textContent = ' → ';
                        line.appendChild(sep2);
                    }

                    if (result_label) {
                        var r = document.createElement('span');
                        r.textContent = result_label;
                        line.appendChild(r);
                    }
                } else {
                    line.textContent = '—';
                }
                body.appendChild(line);

                if (recipe.result && recipe.result.description) {
                    var desc = document.createElement('div');
                    desc.style.marginTop = '8px';
                    desc.className = 'muted';
                    desc.textContent = String(recipe.result.description);
                    body.appendChild(desc);
                }

                var details = document.createElement('details');
                details.recipe_data = recipe;

                var summary = document.createElement('summary');
                summary.textContent = 'Details';
                details.appendChild(summary);

                var pre = document.createElement('pre');
                pre.textContent = '';
                details.appendChild(pre);

                inner.appendChild(details);

                return card;
            }

            function render_list(recipes) {
                var frag = document.createDocumentFragment();
                var i = 0;

                if (!recipes.length) {
                    render_empty_state('No matches.', 'Try fewer words or different terms.');
                    return;
                }

                for (i = 0; i < recipes.length; i += 1) {
                    frag.appendChild(build_card(recipes[i]));
                }

                recipe_list.textContent = '';
                recipe_list.appendChild(frag);
            }

            function apply_search() {
                var query = normalize_text(search_input.value).trim();
                var tokens = query ? query.split(/\s+/) : [];
                var results = [];
                var i = 0;
                var j = 0;
                var ok = true;

                if (!tokens.length) {
                    filtered_recipes = all_recipes.slice(0);
                } else {
                    for (i = 0; i < all_recipes.length; i += 1) {
                        ok = true;
                        for (j = 0; j < tokens.length; j += 1) {
                            if (tokens[j] && all_recipes[i].search_text.indexOf(tokens[j]) === -1) {
                                ok = false;
                                break;
                            }
                        }
                        if (ok) {
                            results.push(all_recipes[i]);
                        }
                    }
                    filtered_recipes = results;
                }

                set_status(filtered_recipes.length + ' / ' + all_recipes.length + ' recipes');
                render_list(filtered_recipes);
            }

            function schedule_search() {
                if (pending_render) {
                    return;
                }
                pending_render = window.requestAnimationFrame(function () {
                    pending_render = 0;
                    apply_search();
                });
            }

            function prepare_recipes(data) {
                var i = 0;
                for (i = 0; i < data.length; i += 1) {
                    data[i].search_text = build_search_text(data[i]);
                }
            }

            function try_fetch_json(urls, index, errors) {
                var url = '';
                if (index >= urls.length) {
                    set_status('Load failed');
                    render_empty_state(
                        'Could not load the recipes JSON.',
                        'Make sure the JSON file is served next to this HTML file as: ' + urls.join(' or ')
                    );
                    return;
                }

                url = urls[index];
                fetch(url, { cache: 'no-store' })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function (data) {
                        if (!Array.isArray(data)) {
                            throw new Error('Expected a JSON array');
                        }
                        all_recipes = data;
                        prepare_recipes(all_recipes);
                        filtered_recipes = all_recipes.slice(0);
                        set_status(all_recipes.length + ' recipes loaded');
                        render_list(filtered_recipes);
                        search_input.focus();
                    })
                    .catch(function (err) {
                        errors.push(url + ': ' + String(err && err.message ? err.message : err));
                        try_fetch_json(urls, index + 1, errors);
                    });
            }

            recipe_list.addEventListener('click', function (event) {
                var summary_el = event.target.closest ? event.target.closest('summary') : null;
                var details_el = null;
                var pre_el = null;

                if (!summary_el) {
                    return;
                }

                details_el = summary_el.parentNode;
                if (!details_el || String(details_el.tagName).toLowerCase() !== 'details') {
                    return;
                }

                window.setTimeout(function () {
                    if (!details_el.open) {
                        return;
                    }
                    pre_el = details_el.querySelector('pre');
                    if (!pre_el || pre_el.textContent) {
                        return;
                    }
                    pre_el.textContent = safe_json_preview(details_el.recipe_data);
                }, 0);
            });

            search_input.addEventListener('input', schedule_search);

            (function init() {
                var candidate_urls = [
                    './_wurm_unlimited_default_581_recipes.json',
                    './wurm_unlimited_default_581_recipes.json'
                ];
                set_status('Loading…');
                try_fetch_json(candidate_urls, 0, []);
            })();
        })();
    </script>
</body>
</html>
